[project]
name = "customer-propensity-ml-system"
version = "0.1.0"
description = "A production-oriented machine learning system for customer propensity modeling."
readme = "README.md"
authors = [
    { name = "Eduardo Luiz Zanotto" }
]
requires-python = ">=3.14"
dependencies = []

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "customer_propensity"

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "ruff>=0.16.8",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = [
	"E",
	"F",
	"I",
	"B",
	"UP",
]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.14"
typeCheckingMode = "standard"

[tool.pytest]
testpaths = ["tests"]
addopts = ["-ra", "-q"]
